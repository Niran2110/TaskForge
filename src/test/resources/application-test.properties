spring.application.name=taskforge-integration-test

# Separate in-memory database for integration tests
spring.datasource.url=jdbc:h2:mem:taskforge_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create the test schema and discard it when the context closes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test-only JWT configuration
security.jwt.secret=VGhpc0lzRGV2ZWxvcG1lbnRPbmx5U2VjcmV0S2V5Rm9yVGFza0ZvcmdlMjAyNg==
security.jwt.expiration-ms=86400000